<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Talent Market Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>TMI</h1>
        <p>Talent Market Intelligence</p>
      </div>
      <div class="header-actions">
        <button class="settings-button" data-view="settings" type="button">設定</button>
        <nav class="tabs" aria-label="ページ切り替え">
          <button class="tab is-active" data-view="dashboard">TOP</button>
          <button class="tab" data-view="crawler">クローリング</button>
          <button class="tab" data-view="manual">直接入力</button>
        </nav>
      </div>
    </header>

    <main>
      <section id="dashboard" class="view is-active">
        <div class="metric-grid">
          <article class="metric">
            <span>求人件数</span>
            <strong id="jobCount">0</strong>
          </article>
          <article class="metric">
            <span>企業数</span>
            <strong id="companyCount">0</strong>
          </article>
          <article class="metric">
            <span>平均年収</span>
            <strong id="avgIncome">-</strong>
          </article>
        </div>

        <div class="dashboard-layout">
          <div class="insight-column">
            <section class="panel">
              <div class="panel-head">
                <h2>必須スキル傾向</h2>
                <select id="skillTypeFilter" aria-label="スキル種別">
                  <option value="required">必須</option>
                  <option value="preferred">推奨</option>
                </select>
              </div>
              <div id="skillChart" class="skill-chart empty">データがありません</div>
            </section>

            <section class="panel compact-panel">
              <div class="panel-head">
                <h2>資格傾向</h2>
              </div>
              <div id="certificationChart" class="skill-chart certification-cloud empty">データがありません</div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head">
              <h2>求人一覧</h2>
              <div class="search-box">
                <input id="searchInput" type="search" placeholder="企業名・業務内容・スキルで検索">
              </div>
            </div>
            <div id="jobList" class="job-list empty">まだ求人情報が保存されていません</div>
          </section>
        </div>
      </section>

      <section id="crawler" class="view">
        <section class="panel crawler-panel">
          <div class="panel-head">
            <h2>求人情報を取得</h2>
          </div>

          <form id="crawlForm" class="crawl-form">
            <label>
              求人一覧URL
              <input id="crawlUrl" type="url" value="https://nttdata-career.jposting.net/joblist/index.html?t[]=10" placeholder="https://example.com/joblist" required>
            </label>
            <div class="form-row">
              <label>
                企業名選択
                <select id="crawlCompanySelect">
                  <option value="NTT DATA">NTT DATA</option>
                  <option value="custom">直接入力</option>
                </select>
              </label>
              <label>
                企業名
                <input id="companyName" type="text" value="NTT DATA" required>
              </label>
              <label>
                最大取得件数
                <input id="crawlLimit" type="number" min="1" max="50" value="10">
              </label>
            </div>
            <button class="primary-button" type="submit">クロール開始</button>
          </form>

          <div id="crawlStatus" class="status">URLを入力してクロールを開始してください。</div>
        </section>

        <section class="panel">
          <h2>抽出結果プレビュー</h2>
          <div id="crawlPreview" class="job-list empty">取得した求人がここに表示されます</div>
        </section>
      </section>

      <section id="manual" class="view">
        <section class="panel crawler-panel">
          <div class="panel-head">
            <h2>求人票を貼り付け</h2>
            <button id="parseSampleButton" class="ghost-button" type="button">入力を解析</button>
          </div>

          <form id="manualForm" class="crawl-form">
            <div class="form-row">
              <label>
                企業名選択
                <select id="manualCompanySelect">
                  <option value="NTT DATA">NTT DATA</option>
                  <option value="custom">直接入力</option>
                </select>
              </label>
              <label>
                企業名
                <input id="manualCompanyName" type="text" value="NTT DATA" required>
              </label>
            </div>
            <label>
              求人票テキスト
              <textarea id="manualText" rows="18" placeholder="求人票を丸ごと貼り付けてください" required></textarea>
            </label>
            <button class="primary-button" type="submit">解析してプレビュー</button>
          </form>

          <div id="manualStatus" class="status">求人票を貼り付けると、職務内容・年収・必須/歓迎スキルなどを抽出します。</div>
        </section>

        <section class="panel">
          <h2>解析結果プレビュー</h2>
          <div id="manualPreview" class="job-list empty">解析した求人がここに表示されます</div>
          <div id="manualEditor" class="manual-editor" hidden></div>
        </section>
      </section>

      <section id="settings" class="view">
        <section class="panel crawler-panel">
          <div class="panel-head">
            <h2>辞書設定</h2>
            <button id="resetDictionaryButton" class="ghost-button" type="button">初期値に戻す</button>
          </div>

          <form id="dictionaryForm" class="crawl-form">
            <label>
              スキル辞書
              <textarea id="skillDictionaryInput" rows="14" placeholder="1行に1単語で入力"></textarea>
            </label>
            <label>
              資格辞書
              <textarea id="certificationDictionaryInput" rows="10" placeholder="1行に1資格で入力"></textarea>
            </label>
            <button class="primary-button" type="submit">辞書を保存</button>
          </form>

          <div id="dictionaryStatus" class="status" hidden></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>求人情報管理</h2>
            <button id="cleanupDataButton" class="ghost-button" type="button">データ更新</button>
          </div>
          <div id="settingsJobStatus" class="status" hidden></div>
          <div id="settingsJobList" class="settings-job-list empty">削除できる求人情報がありません</div>
        </section>
      </section>
    </main>

    <template id="jobCardTemplate">
      <article class="job-card">
        <div class="job-card-head">
          <div>
            <h3></h3>
            <p class="company"></p>
          </div>
          <span class="income"></span>
        </div>
        <p class="description"></p>
        <div class="job-meta"></div>
        <dl class="skill-block">
          <div>
            <dt>必須</dt>
            <dd class="required"></dd>
          </div>
          <div>
            <dt>推奨</dt>
            <dd class="preferred"></dd>
          </div>
          <div>
            <dt>資格</dt>
            <dd class="certifications"></dd>
          </div>
        </dl>
        <p class="notes"></p>
        <a class="source" target="_blank" rel="noreferrer">求人ページ</a>
      </article>
    </template>

    <script src="company-parsers.js"></script>
    <script src="crawler.js"></script>
    <script src="app.js"></script>
  </body>
</html>
